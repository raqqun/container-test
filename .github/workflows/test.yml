name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: ^1.22

      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Test container-test
        run: |
          go test -v -cover -coverprofile=coverage.out ./...

      - name: Test container-test with example container tests
        run: |
          go run ./... -config tests.example.yaml -image curlimages/curl:latest -debug

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

