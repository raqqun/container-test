name: release

on:
  push:
    tags:
      - 'v1.*.*'

env:
  GO111MODULE: on
  sha_short_length: 8


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test container-test
        run: |
          go test -v -cover -coverprofile=coverage.out ./...

      - name: Test container-test with example container tests
        run: |
          go run ./... -config tests.example.yaml -image curlimages/curl:latest -debug

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
